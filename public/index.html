<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CryptoTrader AI</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CryptoTrader">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[#07090e] text-[#f0f4f8] antialiased select-none min-h-screen pb-12 font-sans">

  <!-- ============================================================== -->
  <!-- CLEAN TOP BAR -->
  <!-- ============================================================== -->
  <header class="top-header px-4 py-3 flex items-center justify-between border-b border-[#151c2c]">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#00f2fe] to-[#00f59b] flex items-center justify-center shadow-[0_0_12px_rgba(0,242,254,0.3)]">
        <i data-lucide="zap" class="w-4 h-4 text-black"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-sm tracking-wide text-white leading-tight">CryptoTrader <span class="text-[#00f2fe]">AI</span></h1>
        <div class="flex items-center gap-1.5 text-[10px] text-[#6b7c93] font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-[#00f59b] pulse-dot"></span>
          <span id="binanceWsStatus" class="text-[#00f59b]">Binance Futures</span>
          <span>•</span>
          <span class="text-[#8899a6]">SQLite DB</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="resetPaperWallet()" title="Reiniciar Balance" class="p-2 rounded-xl bg-[#0f1422] border border-[#1b2337] text-[#8899a6] hover:text-[#ffd166] transition-colors">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
      <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-[#0f1422] border border-[#1b2337] text-[#8899a6] hover:text-white transition-colors">
        <i data-lucide="sliders" class="w-4 h-4 text-[#00f2fe]"></i>
      </button>
    </div>
  </header>

  <!-- ============================================================== -->
  <!-- MAIN CLEAN MOBILE CONTAINER -->
  <!-- ============================================================== -->
  <main class="px-3.5 py-4 max-w-md mx-auto space-y-4">

    <!-- 1. ACCOUNT HERO CARD (Minimalist & High Impact) -->
    <div class="card p-4 bg-gradient-to-b from-[#0f1523] to-[#0a0e18] border-[#1c263c] shadow-lg">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold text-[#8899a6]">Total Equity</span>
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-mono font-bold text-[#8899a6]">Auto-IA</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="autoPilotToggle" checked class="sr-only peer">
            <div class="w-9 h-5 bg-[#1a2336] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#00f59b]"></div>
          </label>
        </div>
      </div>

      <!-- Main Balance Number -->
      <div class="flex items-baseline gap-2 mb-3">
        <span id="walletEquity" class="font-mono font-black text-2xl sm:text-3xl text-white tracking-tight">$1,000.00</span>
        <span id="statTotalProfitHeader" class="font-mono font-extrabold text-sm text-[#00f59b]">+$0.00</span>
      </div>

      <!-- Goal Progress Bar -->
      <div class="bg-[#07090e] p-2.5 rounded-xl border border-[#172033] mb-3">
        <div class="flex items-center justify-between text-[11px] font-mono mb-1.5">
          <span class="text-[#8899a6]">🎯 Meta de Ganancia</span>
          <span id="globalGoalAmount" class="font-bold text-[#00f59b]">+$0.00 / $10.00</span>
        </div>
        <div class="w-full h-2 bg-[#121929] rounded-full overflow-hidden">
          <div id="globalGoalProgressBar" class="h-full bg-gradient-to-r from-[#00f2fe] to-[#00f59b] transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Quick Metrics Row -->
      <div class="grid grid-cols-3 gap-2 pt-1 border-t border-[#151c2c] text-center font-mono">
        <div>
          <span class="text-[10px] text-[#6b7c93] block">Balance</span>
          <span id="walletBalance" class="text-xs font-bold text-white">$1,000.00</span>
        </div>
        <div>
          <span class="text-[10px] text-[#6b7c93] block">Margen Disp.</span>
          <span id="walletAvailableMargin" class="text-xs font-bold text-[#00f2fe]">$900.00</span>
        </div>
        <div>
          <span class="text-[10px] text-[#6b7c93] block">Acierto</span>
          <span id="walletWinRate" class="text-xs font-bold text-[#ffd166]">0.0%</span>
        </div>
      </div>
    </div>

    <!-- Quick AI Scan Trigger Button -->
    <button id="btnScanNow" class="btn-primary w-full py-2.5 px-4 text-xs font-extrabold uppercase tracking-wider flex items-center justify-center gap-2 shadow-md">
      <i data-lucide="sparkles" class="w-4 h-4"></i>
      <span>Escanear Mercado con DeepSeek</span>
    </button>

    <!-- 2. OPERACIONES ACTIVAS EN VIVO -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5">
          <i data-lucide="activity" class="w-4 h-4 text-[#00f2fe]"></i>
          <h2 class="font-extrabold text-xs uppercase tracking-wider text-white">Operaciones Activas</h2>
        </div>
        <span id="openPositionsBadge" class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-[#00f2fe]/15 text-[#00f2fe] border border-[#00f2fe]/30">
          0 Activas
        </span>
      </div>

      <!-- Container of Active Cards -->
      <div id="livePositionsContainer" class="space-y-2.5">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- 3. HISTORIAL DE OPERACIONES (SQLite DB) -->
    <div class="space-y-2.5 pt-2">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5">
          <i data-lucide="history" class="w-4 h-4 text-[#00f59b]"></i>
          <h2 class="font-extrabold text-xs uppercase tracking-wider text-white">Historial de Ganancias</h2>
        </div>
        <span class="text-[10px] font-mono text-[#6b7c93]">
          Total: <b id="statTotalTrades" class="text-white">0</b> trades
        </span>
      </div>

      <!-- Container of Closed Trades Cards -->
      <div id="tradeHistoryContainer" class="space-y-2">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </main>

  <!-- ============================================================== -->
  <!-- SETTINGS MODAL -->
  <!-- ============================================================== -->
  <div id="settingsModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 modal-backdrop hidden">
    <div class="bg-[#0f1422] border border-[#1e273d] rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 shadow-2xl relative">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-[#182136]">
        <div class="flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-[#00f2fe]"></i>
          <h3 class="font-extrabold text-sm text-white">Configuración</h3>
        </div>
        <button onclick="closeSettingsModal()" class="text-[#8899a6] hover:text-white text-xl font-bold p-1">&times;</button>
      </div>

      <div class="space-y-3.5">
        <!-- DeepSeek API Key -->
        <div class="bg-[#07090e] p-3 rounded-xl border border-[#172033]">
          <label class="text-[11px] font-bold text-[#00f2fe] block mb-1">DeepSeek API Key</label>
          <input type="password" id="inputDeepSeekKey" placeholder="sk-..." class="w-full bg-[#0f1422] border border-[#1e273d] rounded-lg px-3 py-2 text-xs text-white font-mono focus:border-[#00f2fe] focus:outline-none">
        </div>

        <!-- Strategy Target -->
        <div class="bg-[#07090e] p-3 rounded-xl border border-[#172033] grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-[#8899a6] block mb-1">Meta Total ($)</label>
            <input type="number" id="inputTargetProfit" value="10.0" min="1" step="1" class="w-full bg-[#0f1422] border border-[#1e273d] rounded-lg px-2.5 py-1.5 text-xs text-white font-mono">
          </div>
          <div>
            <label class="text-[10px] text-[#8899a6] block mb-1">Margen (% Capital)</label>
            <input type="number" id="inputRiskPercent" value="5" min="1" max="15" class="w-full bg-[#0f1422] border border-[#1e273d] rounded-lg px-2.5 py-1.5 text-xs text-white font-mono">
          </div>
        </div>

        <!-- Telegram Notifications -->
        <div class="bg-[#07090e] p-3 rounded-xl border border-[#172033] space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-[#ffd166]">Alertas por Telegram</span>
            <input type="checkbox" id="checkboxTelegramEnabled" class="accent-[#ffd166]">
          </div>
          <input type="password" id="inputTelegramToken" placeholder="Bot Token" class="w-full bg-[#0f1422] border border-[#1e273d] rounded-lg px-2.5 py-1.5 text-xs text-white font-mono">
          <input type="text" id="inputTelegramChatId" placeholder="Chat ID" class="w-full bg-[#0f1422] border border-[#1e273d] rounded-lg px-2.5 py-1.5 text-xs text-white font-mono">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-5">
        <button onclick="closeSettingsModal()" class="px-3 py-2 rounded-lg bg-[#182136] text-[#8899a6] hover:text-white text-xs font-bold">Cancelar</button>
        <button onclick="saveSettings()" class="btn-primary px-4 py-2 rounded-lg text-xs font-extrabold uppercase">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-4 right-3 left-3 sm:left-auto z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

  <!-- App Script -->
  <script src="/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
